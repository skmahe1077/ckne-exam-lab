# Reference fix: path-prefix matches corrected so each path reaches the
# backend with the matching name.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: path-routes
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  parentRefs:
    - name: atm-gw
  hostnames:
    - app.ckne.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /blue
      backendRefs:
        - name: blue
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /green
      backendRefs:
        - name: green
          port: 80
