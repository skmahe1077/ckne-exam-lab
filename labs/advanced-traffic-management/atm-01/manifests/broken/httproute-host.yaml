# Intentionally broken: the two host-based rules exist, but their
# backendRefs are swapped — a request for blue.ckne.local is sent to the
# green Service, and vice versa. Fix the backendRefs so each hostname
# reaches the backend with the matching name.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: host-routes
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  parentRefs:
    - name: atm-gw
  hostnames:
    - blue.ckne.local
  rules:
    - backendRefs:
        - name: green
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: host-routes-green
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  parentRefs:
    - name: atm-gw
  hostnames:
    - green.ckne.local
  rules:
    - backendRefs:
        - name: blue
          port: 80
