# Starting state: both backendRefs have equal weight (1/1, i.e. an even
# 50/50 split). The task is to change the weights to an 80/20 canary split
# (80 to stable, 20 to canary) without changing anything else.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: canary-split
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  parentRefs:
    - name: atm-gw
  hostnames:
    - app.ckne.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: stable
          port: 80
          weight: 1
        - name: canary
          port: 80
          weight: 1
