# Always-correct starting state: the egress-client Deployment. It is healthy
# and Ready from the moment setup.sh applies it — it is deliberately kept off
# this lab's designated egress-gateway node (via nodeAffinity) so the
# gateway/client role split matches Cilium's documented egress-gateway
# topology (client and gateway must be different nodes).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-client
  namespace: ${NAMESPACE}
  labels:
    app: egress-client
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: egress-client
  template:
    metadata:
      labels:
        app: egress-client
        app.kubernetes.io/part-of: ckne-hands-on
        ckne.openai.com/lab-id: "${TASK_ID}"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: ckne.openai.com/atm-05-egress-node
                    operator: NotIn
                    values: ["true"]
      containers:
        - name: client
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
