# Always-correct supporting objects: two long-lived client Pods used to
# generate the two flows this lab is about. client-a (role=allowed) is
# supposed to be permitted to reach web; client-b (role=blocked) is supposed
# to be denied. Which one actually gets through depends entirely on the
# NetworkPolicy in manifests/broken/ — that is the part to fix.
apiVersion: v1
kind: Pod
metadata:
  name: client-a
  namespace: ${NAMESPACE}
  labels:
    role: allowed
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: client-b
  namespace: ${NAMESPACE}
  labels:
    role: blocked
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
