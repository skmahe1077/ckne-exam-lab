# Reference fix: readinessProbe corrected to check "/" (which nginx actually
# serves), so Pods become Ready and the Service picks up Endpoints. This is
# the only change required.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: ${NAMESPACE}
  labels:
    app: orders
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
        app.kubernetes.io/part-of: ckne-hands-on
        ckne.openai.com/lab-id: "${TASK_ID}"
    spec:
      containers:
        - name: orders
          image: nginx:1.27
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: ${NAMESPACE}
  labels:
    app: orders
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  selector:
    app: orders
  ports:
    - name: http
      port: 80
      targetPort: 80
