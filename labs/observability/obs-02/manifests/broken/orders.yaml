# Intentionally broken: the readinessProbe checks GET /healthz, but the
# nginx-based "orders" container only ever serves /. The probe never
# succeeds, so the Pods stay Running-but-NotReady forever, the Service
# "orders" never gets any Endpoints, and every request to it fails — even
# though DNS resolution of the Service name itself works fine (that's the
# point: this is NOT a DNS problem).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: ${NAMESPACE}
  labels:
    app: orders
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
        app.kubernetes.io/part-of: ckne-hands-on
        ckne.openai.com/lab-id: "${TASK_ID}"
    spec:
      containers:
        - name: orders
          image: nginx:1.27
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: ${NAMESPACE}
  labels:
    app: orders
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  selector:
    app: orders
  ports:
    - name: http
      port: 80
      targetPort: 80
