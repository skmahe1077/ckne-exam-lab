# Always-correct supporting objects: a deliberately slow "backend" app
# (stdlib-only Python, same pattern as shared/manifests/streaming-echo) that
# genuinely takes ~3s to answer any request other than /health or /metrics,
# a Service correctly annotated for Prometheus scraping, and a persistent
# "client" Pod used to generate real requests. None of these are broken —
# the backend's slowness is real and by design; only the client's timeout
# (manifests/broken/client-config.yaml) is misconfigured.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-app
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
data:
  server.py: |
    import http.server
    import os
    import socketserver
    import time
    import urllib.parse

    DELAY = float(os.environ.get("DELAY_SECONDS", "3"))
    COUNT = 0

    class Handler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            global COUNT
            parsed = urllib.parse.urlparse(self.path)
            path = parsed.path
            qs = urllib.parse.parse_qs(parsed.query)

            if path == "/health":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok\n")
                return

            if path == "/metrics":
                body = (
                    "# HELP obs06_backend_delay_seconds Configured backend processing delay\n"
                    "# TYPE obs06_backend_delay_seconds gauge\n"
                    "obs06_backend_delay_seconds %s\n" % DELAY
                ).encode()
                self.send_response(200)
                self.send_header("Content-Type", "text/plain; version=0.0.4")
                self.end_headers()
                self.wfile.write(body)
                return

            nonce = qs.get("nonce", ["none"])[0]
            COUNT += 1
            time.sleep(DELAY)
            print("PROCESSED request nonce=%s delay=%ss count=%d" % (nonce, DELAY, COUNT))
            self.send_response(200)
            self.send_header("Content-Type", "text/plain")
            self.end_headers()
            self.wfile.write(("processed nonce=%s after %ss\n" % (nonce, DELAY)).encode())

        def log_message(self, fmt, *args):
            print("%s - %s" % (self.address_string(), fmt % args))

    socketserver.TCPServer.allow_reuse_address = True
    with socketserver.ThreadingTCPServer(("0.0.0.0", 8080), Handler) as httpd:
        httpd.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ${NAMESPACE}
  labels:
    app: backend
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/part-of: ckne-hands-on
        ckne.openai.com/lab-id: "${TASK_ID}"
    spec:
      containers:
        - name: backend
          image: python:3.12-slim
          command: ["python3", "-u", "/app/server.py"]
          env:
            - name: DELAY_SECONDS
              value: "3"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: app
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: app
          configMap:
            name: backend-app
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ${NAMESPACE}
  labels:
    app: backend
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8080"
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: ${NAMESPACE}
  labels:
    app: client
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
