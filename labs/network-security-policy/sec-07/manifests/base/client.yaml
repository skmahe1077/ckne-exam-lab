apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: ${NAMESPACE}
  labels:
    app: client
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
        app.kubernetes.io/part-of: ckne-hands-on
        ckne.openai.com/lab-id: "${TASK_ID}"
    spec:
      containers:
        - name: shell
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
