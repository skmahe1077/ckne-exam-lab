# Reference fix: a single NetworkPolicy that both switches backend into
# default-deny (any Ingress-typed policy selecting a Pod does this
# implicitly) AND allows exactly role=frontend Pods through.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-pod-selector
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: frontend
      ports:
        - protocol: TCP
          port: 80
