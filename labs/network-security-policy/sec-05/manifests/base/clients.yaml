# Always-correct supporting objects in ckne-sec-05-clients (labeled
# team=payments by setup.sh). frontend-a satisfies BOTH conditions the
# policy must require; worker-a satisfies only the namespace condition —
# it must stay blocked once the AND-combined policy is correctly applied.
apiVersion: v1
kind: Pod
metadata:
  name: frontend-a
  namespace: ${CLIENTS_NAMESPACE}
  labels:
    role: frontend
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: worker-a
  namespace: ${CLIENTS_NAMESPACE}
  labels:
    role: worker
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
