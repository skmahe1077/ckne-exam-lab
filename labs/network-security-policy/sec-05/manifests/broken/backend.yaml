# Starting state: backend has NO NetworkPolicy at all, so any Pod in ANY
# namespace can currently reach it — including rogue-frontend, right here
# in backend's own (untrusted) namespace, which carries a matching
# role=frontend Pod label but lives in the wrong namespace. The task is to
# add a single NetworkPolicy from-entry that requires BOTH the namespace
# label AND the pod label together (AND), not either one alone (OR).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ${NAMESPACE}
  labels:
    app: backend
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/part-of: ckne-hands-on
        ckne.openai.com/lab-id: "${TASK_ID}"
    spec:
      containers:
        - name: backend
          image: nginx:1.27
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ${NAMESPACE}
  labels:
    app: backend
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
# rogue-frontend lives in backend's OWN namespace (never labeled
# team=payments) but carries the SAME role=frontend Pod label frontend-a
# has. It must stay blocked: matching the pod label alone is not enough.
apiVersion: v1
kind: Pod
metadata:
  name: rogue-frontend
  namespace: ${NAMESPACE}
  labels:
    role: frontend
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
