# client-a lives in the ckne-sec-04-clients namespace, which setup.sh labels
# network-access=trusted. It should be able to reach backend once the
# namespace-selector policy is added — always-correct supporting object.
apiVersion: v1
kind: Pod
metadata:
  name: client-a
  namespace: ${CLIENTS_NAMESPACE}
  labels:
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
