# Starting state: backend has NO NetworkPolicy at all, so any Pod in ANY
# namespace (including untrusted-client, right here in backend's own
# namespace) can reach it. The task is to add a namespace-selector scoped
# NetworkPolicy that only trusts Pods coming from a namespace labeled
# network-access=trusted.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ${NAMESPACE}
  labels:
    app: backend
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/part-of: ckne-hands-on
        ckne.openai.com/lab-id: "${TASK_ID}"
    spec:
      containers:
        - name: backend
          image: nginx:1.27
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ${NAMESPACE}
  labels:
    app: backend
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
# untrusted-client lives in backend's OWN namespace (which is NOT labeled
# network-access=trusted) — it must remain blocked even though it is "close"
# to backend, because namespace-selector-based policy cares about the
# SOURCE namespace's label, not proximity or any Pod label.
apiVersion: v1
kind: Pod
metadata:
  name: untrusted-client
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
