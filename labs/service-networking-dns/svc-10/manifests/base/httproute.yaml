# Always-correct: the HTTPRoute itself is already written correctly, with
# an explicit cross-namespace backendRef pointing at the "backend" Service
# in ${BACKEND_NAMESPACE}. This is never the part that needs editing — the
# Gateway API spec requires a ReferenceGrant to exist IN THE TARGET
# NAMESPACE before a cross-namespace backendRef like this one is honored,
# and that ReferenceGrant does not exist yet. Until it does, this
# HTTPRoute's own status will show ResolvedRefs=False (reason
# RefNotPermitted) and requests through the Gateway will fail.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-route
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  parentRefs:
    - name: svc10-gw
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: backend
          namespace: ${BACKEND_NAMESPACE}
          port: 80
