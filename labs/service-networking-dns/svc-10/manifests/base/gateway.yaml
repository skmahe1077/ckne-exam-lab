# Always-correct: the Gateway itself, in the PRIMARY namespace
# (${NAMESPACE}). It references the shared, cluster-wide GatewayClass
# "cilium" (installed once by kubeadm-setup/install-addons.sh) by name
# only — this lab never creates or edits a GatewayClass. allowedRoutes
# permits HTTPRoutes from all namespaces to attach (Gateway API's own
# namespace-boundary control here is coarse — "which namespaces may attach
# routes at all"; ReferenceGrant is the separate, finer-grained mechanism
# that controls whether an attached HTTPRoute may reference a backendRef
# Service in ANOTHER namespace, which is what this lab is actually about).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: svc10-gw
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
