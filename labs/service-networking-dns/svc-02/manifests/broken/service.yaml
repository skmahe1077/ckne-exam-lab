# Intentionally broken: targetPort (8080) does not match the port nginx
# actually listens on inside the "web" Pods (80). The Service is type
# NodePort and gets a valid nodePort allocation, and Endpoints even
# populate (Kubernetes never verifies a container is actually listening on
# targetPort) — but every connection through the Service fails.
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: ${NAMESPACE}
  labels:
    app: web
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 8080
