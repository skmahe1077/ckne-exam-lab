# Intentionally broken: the selector references a label ("app: apiserver")
# that no Pod in the namespace actually carries — the "api" Deployment's
# Pods are labeled "app: api". The Service object exists and looks fine on
# a quick glance, but it has zero Endpoints, so no traffic ever reaches a
# Pod.
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ${NAMESPACE}
  labels:
    app: api
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  type: ClusterIP
  selector:
    app: apiserver
  ports:
    - name: http
      port: 80
      targetPort: 80
