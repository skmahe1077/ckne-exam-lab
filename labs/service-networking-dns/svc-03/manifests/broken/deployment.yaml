# Starting scaffold: a healthy Deployment with no Service in front of it at
# all. The task is to create the Service yourself (type: LoadBalancer) —
# see task.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: ${NAMESPACE}
  labels:
    app: shop
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
        app.kubernetes.io/part-of: ckne-hands-on
        ckne.openai.com/lab-id: "${TASK_ID}"
    spec:
      containers:
        - name: shop
          image: nginx:1.27
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
