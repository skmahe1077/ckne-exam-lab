# Intentionally broken: the Service's targetPort (8080) does not match the
# port nginx actually listens on inside the "web" container (80). The Pod
# itself becomes Ready (nothing about its own health depends on the
# Service), so this bug is only visible by actually sending traffic through
# the Service and observing what happens on the wire — exactly what ss and
# tcpdump are for. The "debug" container shares this Pod's network
# namespace with "web", so tools run in "debug" see the same sockets and
# packets as "web" would.
apiVersion: v1
kind: Pod
metadata:
  name: server
  namespace: ${NAMESPACE}
  labels:
    app: server
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  containers:
    - name: web
      image: nginx:1.27
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
    - name: debug
      image: nicolaka/netshoot:latest
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        capabilities:
          add: ["NET_RAW"]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: ${NAMESPACE}
  labels:
    app: server
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  selector:
    app: server
  ports:
    - name: http
      port: 80
      targetPort: 8080
