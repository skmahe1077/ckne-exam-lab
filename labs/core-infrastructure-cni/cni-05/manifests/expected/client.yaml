# Reference fix: remove the dnsPolicy/dnsConfig override entirely. With no
# dnsPolicy specified, the Pod falls back to the Kubernetes default
# ("ClusterFirst"), which resolves in-cluster Service names via CoreDNS
# exactly like every other Pod in the namespace.
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: ${NAMESPACE}
  labels:
    app: client
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
