# Reference fix: the ipBlock CIDR is corrected to the cluster's actual Pod
# CIDR (10.244.0.0/16, set via podSubnet in kubeadm.config and handed out
# by Cilium's IPAM), so Pods actually get IPs that fall inside the allowed
# range. Everything else about the policy is unchanged.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-server-ingress
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  podSelector:
    matchLabels:
      app: server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.244.0.0/16
      ports:
        - protocol: TCP
          port: 80
