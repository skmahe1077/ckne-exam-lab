# Intentionally broken: the ipBlock CIDR does not overlap the cluster's
# actual Pod CIDR (10.244.0.0/16), so no Pod IP the CNI ever hands out can
# ever match this rule — the "server" Pod is effectively unreachable from
# any other Pod even though nothing about the Deployments themselves is
# broken.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-server-ingress
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  podSelector:
    matchLabels:
      app: server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 172.20.0.0/16
      ports:
        - protocol: TCP
          port: 80
