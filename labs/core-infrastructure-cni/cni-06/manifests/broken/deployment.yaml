# Starting scaffold: multi-iface-app runs two containers in one Pod, each
# binding a distinct port, simulating what would otherwise be two separate
# Multus-attached NICs (Multus is not installed in this cluster). There is
# deliberately NO NetworkPolicy applied yet, so both client Pods can reach
# BOTH ports right now — adding the per-port NetworkPolicy is the task.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-iface-app
  namespace: ${NAMESPACE}
  labels:
    app: multi-iface-app
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multi-iface-app
  template:
    metadata:
      labels:
        app: multi-iface-app
        app.kubernetes.io/part-of: ckne-hands-on
        ckne.openai.com/lab-id: "${TASK_ID}"
    spec:
      containers:
        - name: data-plane
          image: busybox:1.36
          command:
            - sh
            - -c
            - "mkdir -p /www && echo data-plane > /www/index.html && httpd -f -p 8080 -h /www"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: mgmt-plane
          image: busybox:1.36
          command:
            - sh
            - -c
            - "mkdir -p /www && echo mgmt-plane > /www/index.html && httpd -f -p 9090 -h /www"
          ports:
            - containerPort: 9090
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
