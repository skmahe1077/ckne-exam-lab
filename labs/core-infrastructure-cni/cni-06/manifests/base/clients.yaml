# Always-correct supporting objects: two client Pods. "client" carries no
# special label (an ordinary workload). "admin-client" carries role=admin
# and is the only identity that should reach the simulated management
# plane (mgmt-svc:9090) once the NetworkPolicy is in place.
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: admin-client
  namespace: ${NAMESPACE}
  labels:
    role: admin
    app.kubernetes.io/part-of: ckne-hands-on
    ckne.openai.com/lab-id: "${TASK_ID}"
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
